<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redefinir senha – My Day</title>
  <style>
    :root {
      --primary: #7C5CBF;
      --primary-dark: #5B3F94;
      --bg: #0E0E1A;
      --card: #1A1A2E;
      --text: #FFFFFF;
      --muted: #9B9BB0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 40px 28px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(124, 92, 191, 0.25);
      border-top-color: var(--primary);
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.15rem; font-weight: 700; margin-bottom: 8px; }
    p { color: var(--muted); font-size: 0.9rem; line-height: 1.6; margin-bottom: 22px; }
    .btn {
      display: block;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 14px;
      border-radius: 50px;
      margin-bottom: 12px;
    }
    .btn:active { background: var(--primary-dark); }
    .btn-secondary {
      display: block;
      color: var(--muted);
      text-decoration: underline;
      font-size: 0.85rem;
      padding: 8px;
    }
    .error { color: #F87171; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Abrindo o My Day…</h1>
    <p id="subtitle">Se o app não abrir automaticamente em alguns segundos, toque no botão abaixo.</p>
    <a class="btn" id="openBtn" href="#">Abrir o app</a>
    <a class="btn-secondary" href="https://play.google.com/store/apps/details?id=habits.myapp">Não tem o app instalado? Baixar na Play Store</a>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    var appUrl = code
      ? 'habitus://reset-password?code=' + encodeURIComponent(code)
      : 'habitus://reset-password';

    document.getElementById('openBtn').href = appUrl;

    if (!code) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('title').textContent = 'Link inválido ou expirado';
      document.getElementById('title').className = 'error';
      document.getElementById('subtitle').textContent = 'Solicite um novo link de redefinição de senha no app.';
      document.getElementById('openBtn').style.display = 'none';
    } else {
      window.location.replace(appUrl);
    }
  </script>
</body>
</html>
